<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Burger House</title>

    <script src="./scripts/template.js"></script>
    <script src="./scripts/db.js"></script>
    <script src="./script.js"></script>

    <link rel="icon" type="image/x-icon" href="./assets/icons/burger-favicon.png"/>
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/basket.css" />
    <link rel="stylesheet" href="./styles/standart.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body onload="init()">
    <header>
      <img class="logo-img" src="./assets/icons/Logo.png" alt="Logo" />
    </header>

    <main>
      <section class="home-content">
        <div class="home-background"></div>
        <div class="home-logo">
          <img src="./assets/icons/home-logo.png" alt="Burger Logo" />
        </div>
        <div class="main-headline">
          <div class="title-row">
            <h1>Burger<span>House</span></h1>
            <div class="rating-content">
              <img src="./assets/icons/star.png" alt="Star"> <span class="rating">4,1</span><span class="all-rating">(317)</span>
            </div>
          </div>
          <p class="title-detail">The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </div>
      </section>

      <div class="content-wrapper">
        <div class="content-restaurant">
          <div id="menu-content" class="main-content">
          </div>
        </div>

        <section class="basket-wrapper" id="basketWrapper">
          <div class="basket">
            <button class="basket-close" onclick="closeBasket()">X</button>
            <div class="basket-headline">
              <h2>Your Basket</h2>
            </div>
            <div class="basket-scrollbar">
              <div id="basket-content"  class="basket-items"></div>
            </div>
            <div class="calculation"></div>
          </div>
        </section>
      </div>

      <div class="basket-backdrop" id="basketBackdrop" onclick="closeBasket()"></div>

      <div class="confirmation" id="confirmationDialog">
        <button class="dialog-close" onclick="closeConfirmation()">X</button>
        <img src="./assets/icons/confirm.png" alt="confirm-logo" class="confirmation-icon">
        <h2>Order confirmed</h2>
        <p>Your food is on the way!</p>
      </div>

      <div class="bottom-nav">
        <button class="nav-btn" onclick="scrollToTop()"><img src="./assets/icons/home.png" alt=""></button>
        <button class="nav-btn"><img src="./assets/icons/person.png" alt=""></button>
        <button class="nav-btn"><img src="./assets/icons/takeout_dining_2.png" alt=""></button>
        <button class="nav-btn cart-btn" id="cartBtn" onclick="openBasket()">
          <img src="./assets/icons/basket.png" class="icon-default" alt="Basket">
          <img src="./assets/icons/basket-aktiv.png" class="icon-active" alt="Basket">
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <div class="copyright-group">
          <img src="./assets/icons/copyright.png" alt="">
          <a href=""><p>2025 BurgerHouse</p> </a>
        </div>
        <a href=""><p>Imprint</p></a>
        <a href=""><p>Cookie Präferenzen</p></a>
      </div>
    </footer>

  </body>
</html>
